<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=League+Spartan:wght@400;600;700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; padding: 0; background-color: #000; }
  .canvas {
    width: 1080px;
    height: 1350px;
    background-color: #171310;
    position: relative;
    overflow: hidden;
    padding: 64px 72px;
    font-family: 'DM Sans', sans-serif;
    color: #F4EEE8;
  }
  .header-brand {
    display: flex;
    align-items: center;
    height: 90px;
    margin-bottom: 24px;
    padding-left: 130px;
  }
  .brand-name {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 4px;
    color: #F4EEE8;
  }
  .headline-container {
    margin-bottom: 14px;
  }
  .headline-row-1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 1.25;
    color: #F4EEE8;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 8px;
  }
  .number-3 {
    font-size: 96px;
    color: #F4EEE8;
    line-height: 1;
  }
  .vino-badge {
    background-color: #8E2846;
    color: #F4EEE8;
    padding: 6px 48px 10px 32px;
    border-radius: 10px;
    display: inline-block;
  }
  .headline-row-2 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 1.15;
    color: #F4EEE8;
    margin-bottom: 8px;
  }
  .headline-row-3 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 1.15;
    color: #F4EEE8;
  }
  .secondary-text {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 32px;
    color: #D9B6A3;
    margin-top: 14px;
    margin-bottom: 26px;
    letter-spacing: 0.5px;
  }
  .photo-frame {
    width: 936px;
    height: 680px;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(244, 238, 232, 0.12);
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .footer-row {
    margin-top: 30px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }
  .slide-indicator {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background-color: rgba(142, 40, 70, 0.35);
    border: 1px solid #8E2846;
    color: #F4EEE8;
    padding: 14px 28px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div data-document-role="page" data-label="FPV Muestra 01 Educativa" class="canvas">
    <div class="header-brand">
      <div class="brand-name">FOTOPOSEVMAKEUP</div>
    </div>
    <div class="headline-container">
      <div class="headline-row-1">
        <span class="number-3">3</span>
        <span class="vino-badge">HÁBITOS</span>
      </div>
      <div class="headline-row-2">QUE COMPLICAN</div>
      <div class="headline-row-3">TU MAQUILLAJE</div>
    </div>
    <div class="secondary-text">Cantidad · Difuminado · Luz</div>
    <div class="photo-frame">
      <img src="https://raw.githubusercontent.com/fpvredessociales-dev/fpv-assets-cdn/main/IMG_0852-.jpg" alt="Detalle de maquillaje profesional FPV">
    </div>
    <div class="footer-row">
      <div class="slide-indicator">Desliza para revisar tu técnica →</div>
    </div>
  </div>
</body>
</html>
